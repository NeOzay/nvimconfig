name = "revue"
description = "Un verdict par entrée du registre de dette, pour une passe de revue."

[fields.id]
type = "slug"

[fields.title]
type = "text"
required = true
from = "title"
description = "l'énoncé de la dette, reporté de l'entrée"

[fields.date]
type = "date"
required = true
from = "date"
description = "date du constat, reportée de l'entrée — jamais celle de la revue"

[fields.reviewed]
type = "date"
required = true
description = "date de cette revue"

[fields.category]
type = "enum"
required = true
values = ["a-solder", "non-pertinent", "doublon", "pas-une-dette", "aggravee", "pertinent", "inverifiable"]
description = "le verdict rendu sur cette entrée"

[sections]
required = ["Vérifié par", "Verdict", "Action"]
optional = ["Arbitrage"]
