[conformite.symptome]
symptome = "« l'implémentation List-dir a subi des mises à jour ; il faut vérifier que l'intégration de Nvim est encore entièrement compatible » ; `:Brief` « ne fonctionne pas si le chantier n'est pas encore créé » ; l'indicateur de tri (« ↑ date ») reste à l'état initial quand le picker est rouvert par `<leader>fr`."
etat = "disparu"
constat = "Les trois volets : (1) compatibilité avec le list-dir actuel — Marqueurs typés (C2), tri typé et `deprecated` (C3), registre v3 (C1), le tout exercé contre la CLI réelle par tests/listdir/ ; (2) `:Brief` sans chantier créé ouvre le brief orphelin ou un picker (C7, tests/chantier/) ; (3) l'indicateur suit le tri au resume (C8, tests/listdir/test_items.lua). `:Dettes` et `:Roadmap` s'ouvrent avec la configuration réelle en headless."

[[dette.actuelle]]
id = "R1"
nature = "alignement"
emplacement = "Brief, C9 ; lua/registres.lua:183 ; docs/plugins/listdir.md:64,116,148,204 ; CLAUDE.md:45 ; tests/listdir/test_registres.lua:168"
constat = "La bascule du pin est posée sur `<A-N>` (lua/registres.lua:183), alors que la doc du plugin (4 endroits), CLAUDE.md et le nom du test annoncent `<A-t>`, comme le Plan (Étape 10). Tout est entré dans le même commit d100e50, et le journal de décisions ne dit aucun changement de touche. Vérifié en headless : `<M-N>` mappé sur `ld_toggle_pin`, `<M-t>` non mappé. Le test déclenche l'action par son nom (`picker:action(\"ld_toggle_pin\")`), d'où un écart qu'aucune vérification n'a vu. C9 n'est pas atteint : la doc ne décrit pas la touche réelle."
trouvee = "01-d100e50"
solution = "Aligner code et doc sur une seule touche. Soit `<A-t>` dans lua/registres.lua:183, ce qui suit le Plan et la doc (aucune collision chez Snacks ni dans la config : grep vide) ; soit `<A-N>` dans docs/plugins/listdir.md (l. 64, 116, 148, 204), CLAUDE.md:45 et le nom du test. Faire passer le test par la touche (`child.type_keys`) plutôt que par `picker:action`, pour que la touche documentée soit celle qu'on vérifie."
severite = "bloquant"

[[dette.actuelle]]
id = "R2"
nature = "qualité"
emplacement = "plugins/listdir/lua/listdir/picker/items.lua:38,288-295 ; lua/registres.lua:181-184"
constat = "`Ozay.ListDir.ItemsOpts.keys` est déclaré `table<string, string>` (touche → nom d'action), et `items.open` l'enveloppe lui-même en `{ name, mode = { \"i\", \"n\" } }`. `:Dettes` lui passe pourtant des tables `{ \"ld_pins\", mode = { \"n\", \"i\" } }`, ce qui donne dans l'input un spec imbriqué `{ { \"ld_pins\", mode = … }, mode = … }`. Ça marche par accident : `snacks.win:action` accepte une table d'actions et l'itère par `ipairs`. Coût : un appel hors du type annoncé, qu'emmylua_ls signale, et une dépendance silencieuse à un détail interne de Snacks. Le `mode` passé par l'appelant est redondant avec celui que pose `items.open`."
trouvee = "01-d100e50"
solution = "Passer des noms d'action dans lua/registres.lua : `keys = { [\"<A-n>\"] = \"ld_pins\", [\"<A-…>\"] = \"ld_toggle_pin\" }`, conformes à `table<string, string>` ; `items.open` pose déjà les modes."
severite = "avertissement"

[verdict]
valeur = "DÉFAVORABLE"
justification = "Une dette bloquant, R1. C9 n'est pas atteint : la touche de bascule du pin est `<A-N>` dans le code, `<A-t>` dans la doc, CLAUDE.md et le nom du test. Le reste du Chantier est conforme : C1 à C8 atteints, les exclusions du Hors-périmètre respectées, aucun Signal de dérive, le symptôme disparu, 121 tests verts, registre v3 conforme et garde de migration en 0. La correction tient en une ligne d'un côté ou de l'autre, plus un test qui passe par la touche. R2, un avertissement sur le type de `keys`, ne pèserait pas seul au-delà de FAVORABLE."
