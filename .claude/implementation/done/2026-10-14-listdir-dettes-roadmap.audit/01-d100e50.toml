etat = "atteint"
constat = "Vérification C1 : les trois `validate --filled` sortent en 0, sans « périmé » ; contrats en version 3 (registre), 2 (patron review, -solde, -ecarte). Les 22 avertissements restants disent `source` déprécié, que la v3 garde en lecture : ce n'est pas une péremption. Garde de migrations/3.md rejouée depuis 3e71f51 : 22 entrées, 44 valeurs, conformes."

[[conformite.critere]]
id = "C2"
critere = "Marqueurs typés : `grep -n 'OPTIONNEL' lua/chantier.lua plugins/listdir/lua/listdir/picker/items.lua` montre que les deux reconnaissent la forme typée (`^<OPTIONNEL`, `^<À REMPLIR`) ; un `reviewed = <OPTIONNEL date>` s'affiche en retrait."
etat = "atteint"
constat = "Preuve déplacée par le Suivi (arbitrage Q1) : `frontmatter.is_marker` (lua/frontmatter.lua:94-99) reconnaît `^<À REMPLIR[> ]` et `^<OPTIONNEL[> ]`, seule définition ; lua/chantier.lua:25 (`filled`) et picker/items.lua:21 (`empty`) l'appellent, plus de table de chaînes exactes. Le test « un Marqueur typé reste en retrait » (tests/listdir/test_frontmatter.lua:49) vérifie que `<OPTIONNEL date>` n'est pas rendu en colonne. Vérification C2 passée."

[[conformite.critere]]
id = "C3"
critere = "Tri : avec le sens inversé (`<A-v>`), les éléments au Marqueur ou sans valeur restent en fin ; les champs `deprecated` sortent du cycle de tri."
etat = "atteint"
constat = "L'inversion Lua a disparu de cli.lua ; `items.keys` (picker/items.lua:99-110) passe le sens en `-champ` à la CLI, qui range Marqueurs et valeurs absentes en fin dans les deux sens. tests/listdir/test_cli.lua « décroissant : le Marqueur reste en fin » (`-date` → recente, ancienne, sans-date) et « le sens inversé passe à la CLI ». `contract.lua` lit `deprecated` (l. 71-72), `items.state` filtre les dépréciés (l. 75-77) ; test « source sort du cycle de tri ». Tests verts (Étape 4, C9)."

[[conformite.critere]]
id = "C4"
critere = "`:Dettes` : pins en tête, dans une couleur propre ; dans chaque groupe, ordre du champ du cycle, puis `date` décroissante, puis `severite` décroissante, sans clé répétée ; sévérité colorée par niveau ; une touche restreint aux pins ; le titre donne le nombre de dettes et de pins."
etat = "atteint"
constat = "lua/registres.lua:147-187 : `before = { \"-pin\" }`, `after = { \"-date\", \"-severite\" }`, `skip = { \"pin\" }` ; une clé fixe égale au champ courant est omise (picker/items.lua:102-106). L'enum `severite` est déclaré de la moindre à la pire gravité (contrat, l. 26-29) : `-severite` met la plus grave d'abord. `decorate` pose `ListDirPinned` sur le libellé et un glyphe `ListDirSeverity<Niveau>` ; groupes définis dans lua/highlights/listdir.lua et appliqués à l'ouverture (nvim_get_hl, vérif. Étape 7). `<A-n>` (`ld_pins`) restreint par `--where pin=true`. Titre « technical-debt  ↑ title 22·0 pin » en headless. tests/listdir/test_registres.lua couvre ordre, clé non répétée, filtre, compteurs et groupes."

[[conformite.critere]]
id = "C5"
critere = "Toggle du pin : la touche appelle `list-dir set` ; le diff de l'entrée ne touche que la ligne `pin` ; le picker se rafraîchit en place."
etat = "atteint"
constat = "Lu selon le journal de décisions du Suivi (2026-10-14) : `set` s'entend de `list-dir toggle <liste> pin --id <id>`. `cli.toggle` (plugins/listdir/lua/listdir/cli.lua:66-77) est la seule écriture ; `toggle_pin` (lua/registres.lua:112-139) oublie l'entrée du cache, relance le finder, garde le curseur et rafraîchit la preview. Tests « toggle ne change que la ligne pin, et revient » et « <A-t> dans le picker : épinglée, en tête, curseur gardé » verts. Une touche le déclenche bien, `<A-N>` (vérif. Étape 7) ; qu'elle ne soit pas celle que la doc annonce relève de C9 (R1)."

[[conformite.critere]]
id = "C6"
critere = "`:Roadmap` ouvre le picker d'éléments de listdir directement sur `.claude/implementation/todo/road-map`."
etat = "atteint"
constat = "`:Roadmap` (lua/cmd.lua) → `registres.roadmap()` → `items.open(<racine>/.claude/implementation/todo/road-map, ct)` sans option (lua/registres.lua:49-64). Rejoué en headless avec la configuration réelle : le picker s'ouvre, titre « road-map  ↑ title » (vérif. Étape 6)."

[[conformite.critere]]
id = "C7"
critere = "`:Brief` sur `master` : un brief hors chantier → ouvert ; plusieurs → picker ; aucun → message. Sur une branche de chantier, inchangé."
etat = "atteint"
constat = "lua/chantier.lua : `scan` collecte suivis et briefs hors `done/`, `orphan_briefs` écarte ceux qu'un suivi cite en `brief` (chemins normalisés), `open_brief` ouvre l'unique ou un picker `chantier_briefs` ; aucun → « …, ni de brief hors chantier ». Le chemin d'une branche de chantier garde sa logique (`find_suivi` puis `resolve`). tests/chantier/test_chantier.lua couvre les cinq cas (un, cité écarté, plusieurs, aucun, branche de chantier) : vert (vérif. Étape 8, rejouée par `make test`)."

[[conformite.critere]]
id = "C8"
critere = "Après un changement de tri, `<leader>fr` rouvre le picker avec un indicateur (« ↑ date ») conforme au tri en cours."
etat = "atteint"
constat = "`<leader>fr` est `Snacks.picker.resume()` (lua/plugins/snacks/picker/init.lua:292-296), qui rejoue `init_opts` ; `on_show` (picker/items.lua:305-308) recalcule le titre depuis `state` à chaque ouverture, resume compris. Test « l'indicateur suit le tri en cours » (tests/listdir/test_items.lua:44-66) : tri changé, fermeture, resume, titre égal au tri courant — vert."

[[conformite.critere]]
id = "C9"
critere = "Tests mini.test du listdir et de `chantier.lua` verts ; `docs/plugins/listdir.md` décrit les nouvelles commandes et touches."
etat = "non-atteint"
constat = "Tests verts (vérification C9 : 121 cas, 0 échec). Mais la doc décrit une touche qui n'existe pas : docs/plugins/listdir.md:64, :116, :148 et :204, et CLAUDE.md:45, annoncent `<A-t>` pour basculer le pin ; le code pose `<A-N>` (lua/registres.lua:183), confirmé en headless par nvim_buf_get_keymap (`<M-N> ld_toggle_pin`, aucun `<M-t>`). La touche réelle n'est décrite nulle part : l'utilisateur qui suit la doc presse `<A-t>` et rien ne se passe."
