[[dette.actuelle]]
id = "R1"
nature = "alignement"
emplacement = "lua/plugins/render-markdown.lua:17-132"
constat = """La spec règle le rendu de render-markdown bien au-delà de `file_types` : `anti_conceal.enabled = false`, `bullet.left_pad`, `checkbox` (icônes, paddings, `scope_highlight`, état custom `[>]`), `heading` (icônes, `left_pad`, `width`), `code` (`position = "right"`, `border = "thin"`, `width = "block"`, paddings, `highlight_language`), `dash`. Comparées à `resolve_config({})` du plugin installé (8e87953), une vingtaine de valeurs diffèrent des défauts. Cela entame la première exclusion du Hors-périmètre (« ses défauts suffisent, l'utilisateur la réglera lui-même ») et matérialise S1. Le Plan (Étape 4 : `opts = { file_types = FILETYPES }, rien d'autre (S1)`) et le Journal de décisions ne disent rien de cet élargissement ; les entrées du Journal sur l'étiquette de langage et docs/plugins/render-markdown.md (Gotchas, `position = "right"`) montrent que ces réglages ont été travaillés pendant le Chantier, sans que la décision soit consignée. Conséquence directe sur l'intention : la comparaison avec markview se fait contre un render-markdown réglé, pas contre ses défauts."""
trouvee = "01-7ccf9e1"
solution = """Deux issues, au choix de l'utilisateur. (a) Ramener `opts` à `{ file_types = require("markdown_renderer").FILETYPES }`, garder les highlights de lua/highlights/render-markdown.lua, retirer de docs/plugins/render-markdown.md les Gotchas qui supposent ces options. (b) Si ces réglages sont voulus, consigner dans le Journal de décisions du Suivi, datée, la décision qui élargit le périmètre (Hors-périmètre 1 et S1), ou écrire R1 en `## Dettes écartées` avec son justificatif, puis relancer l'audit."""
severite = "bloquant"

[[dette.actuelle]]
id = "R2"
nature = "qualité"
emplacement = "lua/plugins/render-markdown.lua:1-3 ; docs/plugins/render-markdown.md (Key Behaviors)"
constat = """Le commentaire d'en-tête de la spec affirme « Rendu laissé aux défauts : seuls les filetypes sont réglés », que les 110 lignes d'options qui suivent démentent. La doc du plugin ne mentionne que `file_types` dans ses Key Behaviors et ne dit rien de `anti_conceal` désactivé, des icônes de titres ni de la position des étiquettes de code. Un lecteur qui compare les deux moteurs, ou qui règle render-markdown lui-même, part d'une description fausse de ce qui est chargé. Le défaut subsiste quelle que soit l'issue de R1, si les options sont gardées."""
trouvee = "01-7ccf9e1"
solution = """Si les options restent : réécrire l'en-tête de lua/plugins/render-markdown.lua (rendu réglé, pas les défauts) et lister dans docs/plugins/render-markdown.md, Key Behaviors, les écarts aux défauts qui changent le comportement (anti_conceal désactivé, étiquettes de code à droite, icônes de titres, paddings). Si elles sont retirées (R1, issue a), le commentaire redevient exact et R2 se solde avec R1."""
severite = "avertissement"

[verdict]
valeur = "DÉFAVORABLE"
justification = """R1 est bloquant d'office : la spec de render-markdown règle son rendu (puces, titres, blocs de code, anti_conceal), ce que le Hors-périmètre exclut et que S1 désigne, sans décision consignée au Journal. Le reste est solide : les six critères sont atteints et vérifiés par exécution (149 tests verts, bascule dans les deux sens au redémarrage, rendu render-markdown sur .md, notification, preview et hover sans erreur, grep C5 élargi vide, refus de `xyz` fichier intact). Aucun autre signal ne se matérialise, et le code markview est déplacé à l'identique. R2 (avertissement) suit le sort de R1. Lever R1, en retirant les options ou en consignant la décision, suffit à rouvrir un verdict favorable."""
