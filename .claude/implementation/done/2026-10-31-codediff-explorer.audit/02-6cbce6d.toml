[conformite.symptome]
symptome = "l'explorateur de codediff ne se pilote pas comme voulu — un clic simple sur un fichier n'affiche rien (seul le double-clic ouvre), l'explorateur reste ouvert après Entrée, et l'ancienne fermeture automatique « ne fonctionnait pas bien »."
etat = "disparu"
constat = "Rejoué sous tmux, en inline puis en side-by-side : un clic simple affiche le diff (C1), Entrée et le double-clic ferment l'explorateur et mettent le focus sur le diff (C3), et `<leader>e` ouvre l'explorateur, lui donne le focus ou le ferme (C4). La fermeture n'attend plus aucun délai, et la course « clic puis Entrée » finit sur le diff."

[[dette.precedente]]
id = "R1"
nature = "qualité"
emplacement = "lua/plugins/codediff/explorer.lua:194-198"
constat = "Un clic dans la zone vide sous la dernière ligne de l'explorateur agit sur le nœud de la dernière ligne : `getmousepos().line` y vaut le numéro de la dernière ligne, pas 0, et la garde `pos.line == 0` ne l'écarte pas. Constaté sous tmux : un clic dans le vide a déplié le groupe « Staged Changes », le suivant a ouvert le diff de top.txt, dernière ligne. Un clic de reprise de focus dans le blanc ouvre un diff ou plie un dossier sans que l'utilisateur l'ait visé."
trouvee = "01-de69218"
solution = "Dans `on_left_release`, ignorer le clic quand il tombe sous la dernière ligne affichée, par exemple quand `pos.winrow` dépasse `vim.api.nvim_win_text_height(win, { start_row = topline - 1, end_row = pos.line - 1 }).all` (topline par `vim.fn.line('w0', win)`) ; vérifier sous tmux qu'un clic dans le vide ne change ni le diff ni les plis."
severite = "avertissement"

[[dette.precedente]]
id = "R2"
nature = "dette induite"
emplacement = "lua/plugins/codediff/explorer.lua:243-253"
constat = "`restore_focus_after_single_file` remplace à l'exécution le champ interne `inline_view.show_single_file`, que `ui/view/init.lua:91` de l'upstream relit à chaque appel. Le plugin est l'upstream mis à jour par lazy : si ce champ change de nom ou si l'appel passe ailleurs, l'enveloppe ne s'applique plus sans rien signaler, et le focus volé par un fichier simple face (`??`, `A`, `D`) en inline revient en silence ; si le module disparaît, `setup()` échoue au chargement. L'enveloppe s'applique aussi hors des sessions explorateur (standalone, historique en inline). Décision consignée au journal et Gotcha documenté (« à revérifier à chaque mise à jour »), mais rien ne déclenche cette revérification."
trouvee = "01-de69218"
solution = "Rendre la casse visible : vérifier dans `setup()` que `inline_view.show_single_file` est une fonction et sinon le signaler par `vim.notify(…, WARN)` au lieu de poser l'enveloppe ; ou figer la version de l'upstream dans la spec (`version`/`commit`) pour que la mise à jour soit un geste conscient ; à terme, demander à l'upstream de rendre le focus dans `helpers.open_real_file`."
severite = "avertissement"

[[dette.precedente]]
id = "R3"
nature = "style"
emplacement = "docs/plugins/codediff.md:53-62"
constat = "La table « Dans un tab CodeDiff » a perdu la ligne `]f` / `[f` (Fichier suivant/précédent), alors que `next_file`/`prev_file` sont des clés valides de l'upstream v4.0.6, toujours posées par les `opts` (init.lua:142-143) : la doc tait un mapping actif. Retrait non consigné au journal de décisions ; le Hors-périmètre dit seulement que leur comportement n'a pas à être défini."
trouvee = "01-de69218"
solution = "Rétablir la ligne `| `]f` / `[f` | Fichier suivant/précédent |` dans la table, ou consigner au Suivi la décision de ne plus documenter cette navigation."
severite = "note"

