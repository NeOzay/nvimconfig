[[conformite.critere]]
id = "C1"
critere = "Un clic simple sur un fichier affiche son diff ; le focus et le curseur restent dans l'explorateur."
etat = "atteint"
constat = "Vérification C1 rejouée sous tmux, en inline et en side-by-side : un clic sur b.lua, c.lua, a.lua et untracked.txt (fichier `??`) affiche son diff, et le focus comme le curseur restent dans l'explorateur. Code lu : `on_left_release` (explorer.lua:185-206) est piloté par `vim.on_key` et appelle `on_file_select` sans toucher au focus. Pour le fichier simple face, c'est l'enveloppe de R2 qui rend le focus."

[[conformite.critere]]
id = "C2"
critere = "Un clic simple sur un dossier bascule son pli."
etat = "atteint"
constat = "Vérification C2 rejouée : deux clics sur `deep` le replient puis le déplient, et deux clics sur le groupe « Staged Changes » le font passer de expanded=false à true puis à false. Code lu : `toggle_fold` (explorer.lua:106-114), qui appelle node:expand()/collapse() puis tree:render()."

[[conformite.critere]]
id = "C3"
critere = "Entrée sur un fichier affiche son diff, met le focus sur le diff et ferme l'explorateur ; Entrée sur un dossier bascule son pli, l'explorateur reste ouvert. Le double-clic fait exactement la même chose qu'Entrée, sur un fichier comme sur un dossier."
etat = "atteint"
constat = "Vérification C3 rejouée : Entrée sur un fichier, qu'il soit déjà affiché ou non, cache l'explorateur et met le focus sur modified. Entrée sur un dossier bascule son pli et laisse l'explorateur ouvert. Un double-clic au rythme réel donne le même résultat qu'Entrée : sur un fichier, diff, focus et explorateur caché ; sur un dossier, une seule bascule. La course « clic puis Entrée 30 ms après » finit elle aussi avec le focus sur le diff. Même comportement en side-by-side. Code lu : `open_file` (l. 123-126) fait hide_and_focus_diff puis on_file_select, et `map_explorer` (l. 156-177) pose `<CR>` et `<2-LeftMouse>`."

[[conformite.critere]]
id = "C4"
critere = "Dans un tab CodeDiff, `<leader>e` : explorateur caché → il s'ouvre et prend le focus ; visible sans le focus → il prend le focus ; focus → il se ferme. `<leader>E` ne fait plus rien dans la vue diff. Hors d'un tab CodeDiff, `:nmap <leader>e` ne montre rien."
etat = "atteint"
constat = "Vérification C4 rejouée : les trois transitions ont été tenues, depuis modified comme depuis original en side-by-side. `<leader>E` est sans effet : `focus_explorer = false` et `toggle_explorer = false` (init.lua:138-139). Pendant la session, le vrai fichier ouvert dans un autre tab a un maparg vide, et le mapping revient au retour dans le tab CodeDiff. Il ne reste rien après `q` ni après `:tabclose`. Un seul écart à la lettre du critère : hors du tab, `:nmap <leader>e` affiche encore les `<leader>ee/ea/ec/eb/eg/el` globaux de lua/plugins/snacks/explorer.lua. Ces mappings existaient avant le chantier et n'en relèvent pas, alors que `maparg('<leader>e')` exact est vide : l'intention du critère est tenue."

[[conformite.critere]]
id = "C5"
critere = "Chaque fois que l'explorateur prend le focus (`<leader>e`, changement de fenêtre, clic), le curseur se place sur la première lettre du nom."
etat = "atteint"
constat = "Vérification C5 rejouée : le curseur tombe sur la première lettre du nom après `<leader>e`, après `<C-w>h` partant de la colonne 0, après un clic sur un fichier profond ou un dossier, et sur un nom tronqué `un_nom_de_fichier…`, en arbre comme en liste. Sur un groupe, il tombe sur le premier caractère non blanc. Code lu : `place_cursor`/`name_col` (l. 59-102) et le WinEnter local au buffer (l. 171-176). Le repli sur le plus long début du nom s'écarte du plan, mais l'écart est consigné au journal."

[[conformite.critere]]
