[verdict]
valeur = "FAVORABLE"
justification = "Les sept critères sont atteints, et chacun a été rejoué sous tmux avec de vrais clics, en inline puis en side-by-side. Aucune exclusion n'est entamée, aucun signal ne s'est matérialisé, et le symptôme a disparu. R1 (clic dans le vide) et R3 (`]f`/`[f` dans la doc) sont corrigées et vérifiées. Il ne reste qu'une dette dans la Dette actuelle, R2, en avertissement : l'enveloppe posée sur un champ interne de l'upstream. Elle est consignée au journal et documentée en Gotcha, elle fonctionne aujourd'hui sur v4.0.6, et elle se contourne. Sa casse éventuelle ne toucherait qu'un cas : le focus d'un fichier simple face en inline. Une seule dette de ce poids ne justifie pas de réserves."
