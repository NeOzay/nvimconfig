etat = "atteint"
constat = "Vérification C6 : l'upstream ne montre que ` M doc/tags`, qu'accepte l'arbitrage Q1 du Plan repris au Suivi ; une fois ce fichier filtré, la sortie est vide. Le fork est vide lui aussi, la ligne `dir` reste commentée (init.lua:18) et `git diff master...6cbce6d -- plugins/` est vide."

